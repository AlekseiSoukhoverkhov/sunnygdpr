<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #111111;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 24px;
        }
        .btn-restore {
            display: inline-block;
            background-color: #0073aa;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .btn-restore:hover {
            background-color: #005177;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cookie Usage Declined</h1>
        <p>Consent to essential technical cookies is required to access and use this website properly.</p>
        
        <button type="button" id="sunnygdpr-restore-btn" class="btn-restore">
            I changed my mind, accept cookies and return to site
        </button>
    </div>

    <script>
        document.getElementById('sunnygdpr-restore-btn').addEventListener('click', function () {
            const date = new Date();
            date.setTime(date.getTime() + (365 * 24 * 60 * 60 * 1000));
            document.cookie = "sunnygdpr_consent=accepted; expires=" + date.toUTCString() + "; path=/; SameSite=Lax";
            
            // Return to the previous page on the site, or fallback to host root
            if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
                window.location.href = document.referrer;
            } else {
                window.location.href = window.location.protocol + "//" + window.location.host + window.location.pathname.split('/wp-content')[0];
            }
        });
    </script>

</body>
</html>
